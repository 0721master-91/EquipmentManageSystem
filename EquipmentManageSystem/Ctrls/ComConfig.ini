*******************************************************************************
* 帧格式字符串意义: 帧中每个字节用空格隔开
* １、不带中括号的数字，表示该字节为固定字节，每帧都不变，用以检查帧的合法性，如帧头帧尾等
* ２、带中括号内容不以$开头的，表示该字节只有可以是这几种情况，每种以|分隔
* 例如 [2B|2D],也用以检查帧的合法性，[*]可以为任何值
* ３、带中括号内容以$开头的，表示数值为地磅读数中的内容，[$1]表示读数的个位，[$2]表示读数的十位，依次类推。
* [$-1]表示读数的十分位，[$-2]表示读数的百分位，依次类推
* 参数项表示意义:
* １、转义：[0|1] 1表示转义，0表示不转义；转义时根据“地磅数据转义查看器”的转换帧格式配置帧格式
* ２、调试：[raw|frame] 用于测试时记录串口日志；raw 表示记录串口传入的原始数据，frame表示记录串口传入的整帧的数据；测试完注释掉即可
* ３、其他参数根据串口调试工具测试的参数值进行配置;不需要或者不确定的参数注释掉即可
********************************************************************************
;;磐石02 2B 30 33 36 36 38 30 33 31 33 03
[串口]
串口号=COM1
调试=raw
;;地磅数据中必须为数字
DIGIT=1
波特率=9600
转义=0
;;数据位=8
;;停止位=1
;;奇偶校验=none
;;替换符=20
;;保留空格=0
;;帧格式=[3D] [$-3] [$-2] [$-1] [$1] [$2] [$3] [*] [*]
;;帧格式=2E [$-3] [$-2] [$-1] [$1] [$2] [$3] 3D
;;帧格式=02 [2B|2D] [$3] [$2] [$1] [$-1] [$-2] [$-3] [*] [*] [*] 03
帧格式=02 31 [$3] [$2] [$1] [$-1] [$-2] [$-3] [*] [*] 0D

[地磅]
数量=1

[串口1]
串口号=COM10
;;地磅数据中必须为数字
DIGIT=1
波特率=9600
数据位=8
停止位=1
;;帧格式=[3D] [$-3] [$-2] [$-1] [$1] [$2] [$3] [*] [*]
;;帧格式=2E [$-3] [$-2] [$-1] [$1] [$2] [$3] 3D
;;帧格式=30 20 [$3] [$2] [$1] [$-1] [$-2] [$-3] [*] [*] [*] [*] [*] [*] 0D 02 31
;;帧格式=82 B1 30 A0 [$3] [$2] [$1] [$-1] [$-2] [$-3] 30 30 30 30 30 30 8D
帧格式=02 [$3] [$2] [$1] [$-1] [$-2] [$-3] 0D 
地磅名称=地磅1
背景色=Red

[串口2]
串口号=COM4
