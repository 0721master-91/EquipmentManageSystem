[Acc]
AccIndex=-1
UserIndex=0

[系统]
使用电话录音盒=1
不自动更新=1
搅拌机ID=5
可以重复打开=是
语言=zh-cn
搅拌站名称=ch
版本=SL
;;用于多地磅并配有刷卡器，打开发货界面根据此字段配置首先选择地磅，可打开多个发货界面，
;;防止多地磅同时刷卡引起错乱
是否多地磅并使用刷卡器=0
;;安全上料使用
使用安全上料 = 否
安全上料刷卡器串口 = COM4
网络中断语音播报 = 0
使用无人值守 = 否
[公告]
MaxID=10000021

[MQURL]
URL=tcp://192.168.0.112:19995
;;无人值守设置是否使用LED屏显示地磅数据
启用LED=否
[无人值守]
;;刷卡队列只能从【smartInOutQueueA】【smartInOutQueueB】【smartInOutQueueC】选择其一
刷卡队列=smartInOutQueueA

;;设备队列标识只能从【smart-A】【smart-B】【smart-C】选择其一，表示当前所用地磅的标识
设备队列=smart-A

;;监听设备队列只能从【controlListenQueueA】【controlListenQueueB】【controlListenQueueC】选择其一
监听队列=controlListenQueueA

;;语音播报队列只能从【smartVoiceQueueA】【smartVoiceQueueB】【smartVoiceQueueC】选择其一
语音队列=smartVoiceQueueA

;;LED屏队列，当前地磅需对应硬件服务大屏名称
显示屏队列=ledDataQueue

当前地磅=A号地磅

;;地磅数值大于等于此值才可用
地磅有效值=0.1

;;固定取一组数字，最大值和最小值的差小于此值时确定地磅稳定
地磅误差值=0.05

[时间限制]
进厂间隔时间限制=30

[语音播报]
语音队列0=dispatchVoiceQueue_Voice
语音队列1=inOutVoiceQueue_Voice
是否广播=是
播报次数=3
[可视化]
闪屏图片=连接界面,连接界面en
登录图片=登录框-白天,登陆框-白天en
主界面左上图片=浅上左新
主界面右上图片=浅上右
主界面上背景图片=浅上背景
